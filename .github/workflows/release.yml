name: Release

# Se déclenche normalement sur un push de tag "v*".
#
# Un tag poussé par un workflow avec le GITHUB_TOKEN par défaut (voir
# auto-tag.yml) ne déclenche PAS cet évènement "push: tags" (protection
# GitHub contre les boucles infinies). auto-tag.yml appelle donc ce
# workflow explicitement via `gh workflow run` (workflow_dispatch), qui
# lui n'est pas soumis à cette restriction.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex: v1.2.3)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"

          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "Release tag must point to a commit present in main."
            exit 1
          fi

          PARENT_COUNT="$(git rev-list --parents -n 1 "${TAG_SHA}" | awk '{print NF - 1}')"

          if [ "${PARENT_COUNT}" -lt 2 ]; then
            echo "Release tag must point to the merge commit of a PR."
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --flavor prod

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
             diagramme-${{ env.RELEASE_TAG }}-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: diagramme-${{ env.RELEASE_TAG }}-android.apk

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux archive
        run: |
          tar -C build/linux/x64/release/bundle \
              -czf diagramme-${{ env.RELEASE_TAG }}-linux-x64.tar.gz \
              .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: diagramme-${{ env.RELEASE_TAG }}-linux-x64.tar.gz

  release:
    name: Create GitHub release
    needs:
      - build-android
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            artifacts/android/*.apk \
            artifacts/linux/*.tar.gz \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes
